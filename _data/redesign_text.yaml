  research:
    sub: 연구 소개
    lead: BRØ1 연구실은 환자 맞춤형 치료제를 평가하고 예측할 수 있는 전임상 약물 테스트베드 개발에 집중하고 있습니다. 환자 유래 역분화 줄기세포(hiPSC)를 표적 뇌세포와 뇌 오가노이드로 분화시켜 환자 개별의 병태생리학적 특징을 정밀하게 분석하고, 이를 인공지능 분석과 결합하여 환자에게 최적화된 약물 조합을 예측합니다.
    areas_title: 연구 분야
    areas_sub: Research Areas
    techs:
      - title: 환자 유래 줄기세포
        en: Patient-derived iPSC models (disease-in-a-dish)
        caption: hiPSC 유래 중뇌 도파민 신경세포 (위상차 현미경, 20×)
        alt: hiPSC 유래 중뇌 도파민 신경세포의 위상차 현미경 사진
        paragraphs:
          - 환자 개별 hiPSC를 기반으로 성인형 신경세포 및 뇌 오가노이드를 분화·배양하여, 환자의 뇌세포 수준에서 발생하는 병리 현상을 실험실 내에서 재현합니다.
          - 이 모델은 역분화 기술, 신경발생학, 줄기세포 생물학에 기반하여 성숙한 인간 뇌조직의 구조와 기능을 재현하도록 설계되며, 개인의 뇌세포를 정밀하게 프로파일링하고 질병을 유발하는 기전을 규명하는 데 활용됩니다.
      - title: 환자 뇌 오가노이드 생산
        en: Patient brain organoid production
        caption: 배양 중인 뇌 오가노이드
        alt: 배양 중인 뇌 오가노이드
        paragraphs:
          - "'미니 브레인'으로 불리는 뇌 오가노이드는 인간 뇌의 복잡성과 질환, 그리고 잠재적 치료법을 이해하는 데 독보적인 창을 제공하는 신경과학 도구입니다."
          - 본 연구실은 환자 유래 세포로 뇌 오가노이드를 제작하고, 다중전극 어레이(MEA)를 이용하여 신경망의 전기생리학적 활동을 측정합니다.
      - title: 뇌 오가노이드 지능
        en: Organoid Intelligence
        caption: Neural Pong
        paragraphs:
          - 최근 인간 뇌세포 기반의 미니 브레인이 간단한 게임을 학습했다는 연구 결과(Kagan et al., <i>Neuron</i>, 2021)는 생물학적 컴퓨팅의 가능성을 열었습니다.
          - BRØ1 연구실은 이 개념을 확장하여 인간 유래 미니 브레인과 컴퓨팅 시스템을 연결한 신경 컴퓨터를 개발하고, 이를 환자 인지기능 반응의 테스트베드로 활용합니다. 이를 통해 약물이 인지 기능에 미치는 영향까지 평가할 수 있는 새로운 전임상 테스트 플랫폼을 구축하고자 합니다.
      - title: 디지털 뇌세포 파운데이션 모델
        en: Digital brain-cell foundation model
        caption: hiPSC 유래 대뇌피질 신경세포의 고함량 이미지 (핵 · 리소좀 · 미토콘드리아)
        alt: hiPSC 유래 대뇌피질 신경세포의 고함량 이미지
        paragraphs:
          - 뇌질환의 세포·분자 수준 병태 정보를 학습한 인공지능 모델을 통해, 복잡한 질환 기전과 환자 간 이질성을 반영한 예측 기반 치료 전략을 개발합니다.
          - 대규모 언어모델(LLM)과 합성곱신경망(CNN) 등 최신 인공지능 기술을 통합하여 환자의 병리학적 데이터를 디지털화하고, 약물 반응성 예측 모델을 최적화하고 있습니다.
    goal_title: 연구 목표
    goal: 환자의 세포 수준 병리 정보를 디지털화하여 인공지능 기반의 정밀 약물 예측 시스템을 완성하고, 이를 통해 뇌질환 치료의 새로운 표준을 제시하는 것을 목표로 합니다.
    imaging_label: Methods
    imaging_title: 세포 이미징 및 분석
    imaging_caption: hiPSC 유래 중뇌 도파민 신경세포 면역형광 염색 (Hoechst · α-synuclein · MAP2)
    imaging_alt: hiPSC 유래 중뇌 도파민 신경세포의 면역형광 사진
    imaging:
      - 고함량 이미징 시스템(Opera Phenix)과 면역세포화학(ICC)을 이용하여 α-synuclein, MAP2, TH 등 단백질의 발현과 세포 내 분포를 정량적으로 분석합니다.
      - 획득한 이미지로부터 세포 형태, 미토콘드리아 기능, 단백질 응집 등의 표현형을 정량화하여 인공지능 모델의 학습 데이터로 활용합니다.
